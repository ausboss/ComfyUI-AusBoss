name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# Publishes the pack to registry.comfy.org whenever pyproject.toml changes
# on main (i.e. on a version bump) or on manual dispatch. Requires the
# repository secret REGISTRY_ACCESS_TOKEN, an API key created for the
# "ausboss" publisher at registry.comfy.org.
jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ausboss/ComfyUI-AusBoss' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

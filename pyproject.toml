[project]
name = "ausboss-nodes"
# Manager/registry search matches against this text, so it names the actual
# nodes instead of describing the collection abstractly.
description = "Polished image and video nodes: Load Video with trim and single-frame picking, Save Video, Save Image (PNG or lossless JPEG XL, exact filenames, caption sidecars), Image Resize, Inpaint Crop and Stitch, LaMa object removal, Mask Refine, Color Match, Frame Interpolate, A/B Image Compare, crop/rotate/pad editors, LoRA Loader with trigger words, LM Studio chat, Select Frame, batch utilities, Math Expression, Show Text, text/number literals, Free Memory, and a Replace Missing Nodes button that swaps known third-party nodes for these."
version = "1.3.0"
# comfy-cli serializes this to JSON verbatim, so `file` publishes the literal
# string {"file": "LICENSE"} to the registry listing. `text` puts a readable
# name there instead. Both forms are supported; the LICENSE file is unchanged.
license = { text = "MIT License" }

keywords = [
    "comfyui", "nodes", "image", "video", "crop", "rotate", "outpaint",
    "ausboss", "save image", "jpeg xl", "jxl", "caption", "dataset",
    "inpaint", "lama", "mask", "color match", "frame interpolation",
    "lora", "resize", "trim video",
]

# Read by comfy-cli into the registry's supported_os field. Nothing in the pack
# is platform-specific. Accelerator claims (Environment :: GPU :: ...) are left
# off deliberately - the nodes run wherever ComfyUI's torch runs, and listing
# accelerators would assert testing that has not happened.
classifiers = ["Operating System :: OS Independent"]

# The nodes use Pillow, NumPy, Torch, and PyAV supplied by ComfyUI.
dependencies = []

# Optional extras. The pack loads and runs fully without them. When one is
# absent: Stitch Inpaint's fix_edge_halo warns once and pastes unchanged,
# while Refine Mask's edge_refine modes stop with an error naming the package
# to install - the user asked for that mode by name, so a silently different
# mask would be worse than the message.
[project.optional-dependencies]
# Refine Mask edge_refine = "guided filter"
guided-filter = ["opencv-contrib-python"]
# Refine Mask edge_refine = "matting", and Stitch Inpaint's fix_edge_halo
matting = ["pymatting>=1.1"]
# Save Image's "jxl lossless" format
jxl = ["pillow-jxl-plugin"]

[project.urls]
Homepage = "https://github.com/ausboss/ComfyUI-AusBoss"
Repository = "https://github.com/ausboss/ComfyUI-AusBoss"
Documentation = "https://github.com/ausboss/ComfyUI-AusBoss#readme"
Issues = "https://github.com/ausboss/ComfyUI-AusBoss/issues"

[tool.comfy]
PublisherId = "ausboss"
DisplayName = "AusBoss"
Icon = "https://github.com/ausboss.png"
# Oldest core the pack is validated against; Manager uses this to refuse
# installs onto incompatible ComfyUI versions.
#
# The key is `requires-comfyui`. comfy-cli reads exactly that name out of
# [tool.comfy]; a key called supported_comfyui_version is silently ignored and
# the registry stores an empty version floor, which is what 1.1.0 shipped with.
requires-comfyui = ">=0.27.1"
